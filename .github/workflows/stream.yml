name: 24/7 Quran Rain Live

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
  push:
    branches: [ main ]

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Find Video File
        run: |
          ls -lh
          # Auto-rename videoo.mp4 to video.mp4 if needed
          if [ -f "videoo.mp4" ]; then mv videoo.mp4 video.mp4; fi
          if [ -f "Video.mp4" ]; then mv Video.mp4 video.mp4; fi
          if [ -f "video.MP4" ]; then mv video.MP4 video.mp4; fi
          ls -lh *.mp4

      - name: Download Last 10 Surahs
        run: |
          mkdir -p quran
          for n in {94..114}; do
            curl -L -A "Mozilla/5.0" -o quran/${n}.mp3 https://server8.mp3quran.net/afs/${n}.mp3
            sleep 1
          done
          for f in quran/*.mp3; do echo "file '$PWD/$f'" >> mylist.txt; done
          ffmpeg -f concat -safe 0 -i mylist.txt -c copy combined_quran.mp3

      - name: Start 24/7 Stream
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
        run: |
          ffmpeg -re -stream_loop -1 -i video.mp4 \
          -stream_loop -1 -i combined_quran.mp3 \
          -filter_complex "[0:a]volume=0.25[rain];[1:a]volume=1.2[quran];[rain][quran]amix=inputs=2:duration=longest:dropout_transition=3[a]" \
          -map 0:v -map "[a]" \
          -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -r 30 -g 60 -b:v 2500k \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv rtmp://a.rtmp.youtube.com/live2/$YT_KEY
